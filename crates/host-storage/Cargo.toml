[package]
name = "minicore-host-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owner-scoped durable storage for MiniCore Host"

[features]
test-support = []

[dependencies]
minicore-host-protocol = { path = "../host-protocol", version = "=0.11.0" }
minicore-host-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
windows-permissions.workspace = true
winsafe = { workspace = true, features = ["advapi", "shell"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
