[package]
name = "minicore-host-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Owner-scoped durable storage for MiniCore Host"

[dependencies]
minicore-host-protocol = { path = "../host-protocol", version = "=0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "3fd5ecda1fb7c717ab0a39218d90268b4d97909c", version = "=0.9.2" }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_ignored = "=0.1.14"
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
