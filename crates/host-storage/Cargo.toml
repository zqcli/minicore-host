[package]
name = "minicore-host-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owner-scoped durable storage for MiniCore Host"

[dependencies]
minicore-host-protocol = { path = "../host-protocol", version = "=0.9.10" }
minicore-runtime.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
