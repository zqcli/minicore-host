[package]
name = "minicore-host-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Typed in-process, stdio and authenticated WSS clients for the MiniCore Host"

[dependencies]
minicore-host-core = { path = "../host-core", version = "0.1.0" }
minicore-host-protocol = { path = "../host-protocol", version = "0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "18a6ac9b82d003330cd870275efca793cdcc9a96", version = "0.9.2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }

futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.0", features = ["test-util", "net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
