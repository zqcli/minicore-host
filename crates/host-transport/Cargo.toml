[package]
name = "minicore-host-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Typed in-process, stdio and authenticated WSS clients for the MiniCore Host"

[dependencies]
minicore-host-diagnostics.workspace = true
tracing = { workspace = true, features = ["std"] }
minicore-host-core.workspace = true
minicore-host-workspace.workspace = true
minicore-host-protocol.workspace = true
minicore-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }

futures-util = { workspace = true, features = ["sink"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }

[dev-dependencies]
minicore-host-storage = { workspace = true, features = ["test-support"] }
minicore-host-resources.workspace = true
minicore-host-provider.workspace = true
tempfile.workspace = true
rcgen = { workspace = true, features = ["ring"] }
tokio = { workspace = true, default-features = true, features = ["test-util", "net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
