[package]
name = "minicore-host-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Direct-owner Host, Agent, and Session controllers for MiniCore"

[dependencies]
minicore-host-diagnostics.workspace = true
tracing = { workspace = true, features = ["std"] }
minicore-host-compaction.workspace = true
minicore-host-protocol.workspace = true
minicore-host-storage.workspace = true
minicore-host-workspace.workspace = true
minicore-runtime.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
subtle.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = { workspace = true, default-features = true, features = ["rt"] }
futures-util.workspace = true

[dev-dependencies]
sha2.workspace = true
minicore-host-provider.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
