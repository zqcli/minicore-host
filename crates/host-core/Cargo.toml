[package]
name = "minicore-host-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Direct-owner Host, Agent, and Session controllers for MiniCore"

[dependencies]
minicore-host-protocol = { path = "../host-protocol", version = "0.1.0" }
minicore-host-storage = { path = "../host-storage", version = "0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "59ee8ce668f72a21d408e6247d3ce075b260db14", version = "=0.10.0" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
subtle = "=2.6.1"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures-util = "=0.3.34"

[dev-dependencies]
minicore-host-provider = { path = "../host-provider", version = "0.1.0" }
tokio-util = "=0.7.20"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
