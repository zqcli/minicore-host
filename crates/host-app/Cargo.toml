[package]
name = "minicore-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MiniCore Host application and process entry point"

[dependencies]
minicore-host-core.workspace = true
minicore-host-protocol.workspace = true
minicore-host-resources.workspace = true
minicore-host-transport.workspace = true
minicore-host-diagnostics.workspace = true
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
rcgen = { workspace = true, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
