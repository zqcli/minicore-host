[package]
name = "minicore-host"
version = "0.9.10"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MiniCore Host application and process entry point"

[dependencies]
minicore-host-core = { path = "../host-core", version = "0.9.10" }
minicore-host-protocol = { path = "../host-protocol", version = "0.9.10" }
minicore-host-resources = { path = "../host-resources", version = "0.9.10" }
minicore-host-transport = { path = "../host-transport", version = "0.9.10" }
minicore-host-diagnostics = { path = "../host-diagnostics", version = "0.9.10" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
