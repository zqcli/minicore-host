[package]
name = "minicore-host-resources"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Production execution resources for MiniCore Host"

[dependencies]
minicore-host-core = { path = "../host-core", version = "0.1.0" }
minicore-host-protocol = { path = "../host-protocol", version = "0.1.0" }
minicore-host-provider = { path = "../host-provider", version = "0.1.0" }
minicore-host-tools = { path = "../host-tools", version = "0.1.0" }
minicore-host-workspace = { path = "../host-workspace", version = "0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "69faf9196991524b5549499d6208a1eaf567bf56", version = "=0.10.0" }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
