[package]
name = "minicore-host-resources"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Production execution resources for MiniCore Host"

[dependencies]
minicore-host-core.workspace = true
minicore-host-protocol.workspace = true
minicore-host-provider.workspace = true
minicore-host-tools.workspace = true
minicore-host-workspace.workspace = true
minicore-runtime.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[dev-dependencies]
minicore-host-storage = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
