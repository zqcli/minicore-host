[package]
name = "minicore-host-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Session-bound agent tool and ephemeral delegation scopes for MiniCore Host"

[dependencies]
minicore-host-local-tools.workspace = true
minicore-host-workspace.workspace = true
minicore-host-protocol.workspace = true
minicore-host-core.workspace = true
minicore-runtime.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true, default-features = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[dev-dependencies]
futures-util.workspace = true
