[package]
name = "minicore-host-tools"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Session-bound agent tool and ephemeral delegation scopes for MiniCore Host"

[dependencies]
minicore-host-local-tools = { path = "../host-local-tools", version = "0.1.0" }
minicore-host-workspace = { path = "../host-workspace", version = "0.1.0" }
minicore-host-protocol = { path = "../host-protocol", version = "0.1.0" }
minicore-host-core = { path = "../host-core", version = "0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "69faf9196991524b5549499d6208a1eaf567bf56", version = "=0.10.0" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "=0.7.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[dev-dependencies]
futures-util = "=0.3.34"
