[package]
name = "minicore-host-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Process-owned structured diagnostics for MiniCore Host"

[dependencies]
minicore-host-protocol.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
time = { workspace = true, features = ["formatting"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
