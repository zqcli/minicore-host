[package]
name = "minicore-host-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Real workspace reads and change observations for MiniCore Host"

[dependencies]
minicore-host-protocol.workspace = true
ignore.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
sha2.workspace = true
similar = { workspace = true, features = ["text", "std"] }
thiserror.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = { workspace = true, default-features = true, features = ["rt"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
