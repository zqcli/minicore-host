[package]
name = "minicore-host-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "OpenAI-compatible HTTP/SSE Model adapter for MiniCore Host"

[dependencies]
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "18a6ac9b82d003330cd870275efca793cdcc9a96", version = "=0.9.2" }
bytes = "=1.12.1"
futures-util = "=0.3.34"
httpdate = "=1.0.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", default-features = false, features = ["macros", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.54.0", default-features = false, features = ["rt-multi-thread", "io-util", "net", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
