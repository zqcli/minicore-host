[package]
name = "minicore-host-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP/SSE Model adapter for MiniCore Host"

[dependencies]
minicore-host-diagnostics.workspace = true
tracing = { workspace = true, features = ["std"] }
minicore-runtime.workspace = true
bytes.workspace = true
futures-util.workspace = true
httpdate.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "net", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
