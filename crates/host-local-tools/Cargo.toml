[package]
name = "minicore-host-local-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Workspace-bound local filesystem and process tools for MiniCore Host"

[dependencies]
minicore-host-workspace.workspace = true
minicore-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["signal", "process"] }
process-wrap = { version = "=8.2.2", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }

[dev-dependencies]
futures-util.workspace = true
tokio-util = { workspace = true, default-features = true }
minicore-host-provider.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
