[package]
name = "minicore-host-local-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Workspace-bound local filesystem and process tools for MiniCore Host"

[dependencies]
minicore-host-workspace = { path = "../host-workspace", version = "0.1.0" }
minicore-runtime = { git = "https://github.com/zqcli/minicore-runtime", rev = "69faf9196991524b5549499d6208a1eaf567bf56", version = "=0.10.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
futures-util = "=0.3.34"
tokio-util = "=0.7.20"
minicore-host-provider = { path = "../host-provider", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
