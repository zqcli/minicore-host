[package]
name = "minicore-host-compaction"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model-backed historical compaction primitives for MiniCore Host"

[dependencies]
minicore-host-protocol.workspace = true
minicore-host-runtime.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures-util.workspace = true
minicore-host-provider.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "time", "net", "io-util", "rt-multi-thread", "sync", "test-util"] }
tokio-util = { workspace = true, default-features = true, features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
