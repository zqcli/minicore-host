name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.90.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quality:
    name: Quality gate (Linux, Rust 1.90.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Run the full foundation quality gate
        run: ./scripts/check.sh

  platform-tests:
    name: Clippy and tests (${{ matrix.os }}, Rust 1.90.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy
      - name: Lint native platform code
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Test native platform contracts
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      - name: Test documentation examples
        run: cargo test --workspace --doc --locked
      - name: List unique native test cases
        run: cargo test --workspace --all-targets --locked -- --list
      - name: Test storage and Host as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\windows-user-tests.ps1

  package:
    name: Package (${{ matrix.target }})
    needs: [quality, platform-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install 1.90.0 --profile minimal --target "$TARGET"
      - name: Build Host with its pinned Runtime dependency
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --package minicore-host --release --locked --target "$TARGET"
      - name: Smoke test and package native release
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py "$TARGET"
      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0
