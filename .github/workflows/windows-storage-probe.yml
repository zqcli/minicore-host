name: Windows storage API probe

on:
  push:
    branches: [ci/windows-storage-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-sync:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust compiler
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Compile standalone safe filesystem probe
        run: rustc +1.90.0 --edition=2024 crates/host-storage/tests/probes/windows_directory_sync.rs -o windows-directory-sync.exe
      - name: Observe native directory synchronization results
        run: .\windows-directory-sync.exe
